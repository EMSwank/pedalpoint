name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**", "test/**", "docs/**"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v \
            --cov=pedalpoint \
            --cov-report=term-missing \
            --cov-fail-under=90

  integration-tests:
    name: Integration Tests (Ollama)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ollama
        run: curl -fsSL https://ollama.ai/install.sh | sh

      - name: Start Ollama and pull model
        run: |
          ollama serve &
          timeout 30 bash -c 'until ollama list 2>/dev/null; do sleep 1; done'
          ollama pull gemma4:e4b

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        env:
          PEDALPOINT_INTEGRATION: "true"
          PEDALPOINT_MODEL: "gemma4:e4b"
        run: pytest tests/integration/ -v

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/
