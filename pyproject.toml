[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pedalpoint"
version = "0.1.0"
description = "MCP server that routes mechanical dev tasks to a local LLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
pedalpoint-server = "pedalpoint.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pedalpoint"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires live Ollama — set PEDALPOINT_INTEGRATION=true",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/pedalpoint"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
