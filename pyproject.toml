[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pedalpoint"
version = "0.5.1"
description = "Hand routine Claude Code tasks to a local model, and measure the tokens saved"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eliot Swank" }]
keywords = ["claude-code", "mcp", "llm", "mlx", "ollama", "local-llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0,<1",
    "anthropic>=0.52,<3",
]

[project.urls]
Homepage = "https://github.com/EMSwank/pedalpoint"
Changelog = "https://github.com/EMSwank/pedalpoint/blob/main/CHANGELOG.md"
Issues = "https://github.com/EMSwank/pedalpoint/issues"

[project.scripts]
pedalpoint-server = "pedalpoint.server:main"
pedalpoint = "pedalpoint.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pedalpoint"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires live Ollama or MLX — set PEDALPOINT_INTEGRATION=true",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/pedalpoint"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
